; bsh-dbus-adapter -- Standalone ESP-IDF firmware for the B/S/H/ D-Bus-2
;
; Build system: PlatformIO with framework = espidf.
;
; espressif32 7.0.1 ships ESP-IDF 6.0.1. (The PlatformIO package version
; "4.60001.0" encodes 6.00.01 -- it is NOT ESP-IDF 4.6.)
;
; Deliberately the official platform, not the pioarduino fork: the fork follows
; the Arduino-ESP32 3.3.x cycle and therefore caps out at ESP-IDF 5.5.5. It also
; installs a different ESP-IDF into the shared package directory
; ~/.platformio/packages/framework-espidf, so alternating builds between this
; project and one on the official platform overwrite each other's toolchain.
;
; Pinned to an exact version, never a floating tag: a silent platform bump would
; swap the ESP-IDF version underneath a timing-sensitive protocol stack. Bump
; deliberately, then re-run the bus timing measurement.

[platformio]
default_envs = bouni-c6

[env]
platform = espressif32@7.0.1
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Regenerates the embedded web UI before every build. See the script for why
; this is not a CMake rule -- the short version is that CMake-based generation
; silently served a stale page.
extra_scripts =
  pre:tools/gen_ui_asset.py
  pre:tools/gen_profiles_asset.py

build_flags =
  -std=gnu++20
  -Wall
  -Wextra
  -Wno-unused-parameter
  ; Designated initialisers zero-initialise the remaining members in C++20, so
  ; this warning fires on exactly the pattern we use deliberately to survive
  ; ESP-IDF structs gaining fields between versions.
  -Wno-missing-field-initializers

build_unflags =
  -std=gnu++2b
  -std=gnu++17

;
; Bouni BSH-Board -- https://github.com/Bouni/BSH-Board
; ESP32-C6. Bus RX=GPIO4 TX=GPIO5, status LED GPIO6 (inv), activity LED GPIO7 (inv).
;
[env:bouni-c6]
board = esp32-c6-devkitm-1

;
; kiu BaSHi -- https://github.com/kiu/BaSHi
; ESP32-C3. Bus RX=GPIO10 TX=GPIO9, heartbeat LED GPIO8.
;
[env:kiu-c3]
board = esp32-c3-devkitm-1
